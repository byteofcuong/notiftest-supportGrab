<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
    <title>Theo dõi đơn Grab</title>
    <style>
      :root {
        --bg: #14161a;
        --panel: #1c1f25;
        --line: #2a2f38;
        --text: #e6e8eb;
        --dim: #98a0ac;
        --xanh: #00b14f;
        --vang: #e0a800;
        --do: #d64541;
      }
      * { box-sizing: border-box; }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
      }
      h1 { font-size: 18px; margin: 0 0 16px; }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 12px;
      }
      .row { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; }
      .label { color: var(--dim); min-width: 130px; flex-shrink: 0; }
      .value { word-break: break-all; }
      .den { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; }
      .den.xanh { background: var(--xanh); }
      .den.vang { background: var(--vang); }
      .den.do { background: var(--do); }
      .canhbao { color: var(--vang); font-size: 13px; padding: 3px 0; }
      button {
        font: inherit;
        color: var(--text);
        background: #262b33;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 14px;
        cursor: pointer;
        margin-right: 8px;
      }
      button:hover { background: #303640; }
      code { color: var(--dim); font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Theo dõi đơn Grab</h1>

    <div class="panel">
      <div class="row">
        <span class="label">Trạng thái</span>
        <span class="value"><span id="den" class="den vang"></span><span id="trangthai">đang tải…</span></span>
      </div>
      <div class="row"><span class="label">Quán</span><span class="value" id="quan">—</span></div>
      <div class="row"><span class="label">Chế độ gửi</span><span class="value" id="chedo">—</span></div>
      <div class="row"><span class="label">Telegram</span><span class="value" id="telegram">—</span></div>
      <div class="row"><span class="label">Đơn hôm nay</span><span class="value" id="donhomnay">—</span></div>
      <div class="row"><span class="label">Đơn gần nhất</span><span class="value" id="donganhat">—</span></div>
    </div>

    <div class="panel">
      <button id="btn-mo">Mở trang Grab / Đăng nhập</button>
      <button id="btn-an">Ẩn đi</button>
      <button id="btn-tai">Tải lại</button>
      <button id="btn-kiem">Kiểm tra kết nối Grab</button>
      <button id="btn-dung">Tạm dừng theo dõi</button>
    </div>

    <div class="panel">
      <div class="row"><span class="label">Lần kiểm tra cuối</span><span class="value" id="kiemtra">chưa kiểm tra</span></div>
      <div class="row"><span class="label">URL hiện tại</span><span class="value"><code id="url">—</code></span></div>
      <div class="row"><span class="label">User-agent</span><span class="value"><code id="ua">—</code></span></div>
      <div class="row"><span class="label">Thư mục phiên</span><span class="value"><code id="phien">—</code></span></div>
      <div id="canhbao"></div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
